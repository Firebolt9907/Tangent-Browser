<!doctype html>
<!-- Google-shaped: the DOCUMENT background is left at the light default and the real dark surface is
     painted on a full-bleed wrapper. body/html alone read this as a light page and invert it on top
     of its own dark theme. -->
<html><head><meta charset="utf-8"><title>wrapper dark</title>
<style>
  html,body{margin:0;padding:0;height:100%}
  #shell{position:absolute;inset:0;background:#1b1b1b;color:#e8eaed}
  a{color:#8ab4f8}
</style></head>
<body>
  <div id="shell"><h1>Results</h1><p>Some text</p><a href="#">A link</a></div>
</body></html>
