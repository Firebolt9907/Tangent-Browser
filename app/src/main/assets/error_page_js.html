<!DOCTYPE html>
<!--
  Branded error page for failed navigations, served by LuminaRequestInterceptor via
  ErrorPages.createUrlEncodedErrorPage (browser-errorpages). The component loads this file as
  resource://android/assets/error_page_js.html with the localized text passed as query params:
    title, description, button, errorCode  (plus advanced-cert params we intentionally ignore).
  Values are inserted as textContent (never innerHTML) so a hostile failing URL embedded in the
  description can't inject markup. The Reload button re-requests the original URL — GeckoView keeps
  the failed URI as the current history entry, so location.reload() retries the real page, not this
  document.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1c1b1f;
      --muted: #5f5c66;
      --accent: #0060df;
      --accent-fg: #ffffff;
      --card: #f4f2f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b1f;
        --fg: #eae6ef;
        --muted: #a9a4b0;
        --accent: #7c9dff;
        --accent-fg: #08213f;
        --card: #26242b;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 12px;
    }
    p.description {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 28px;
      word-break: break-word;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 1rem;
      font-weight: 600;
      padding: 13px 28px;
      cursor: pointer;
      min-width: 180px;
    }
    button:active { opacity: 0.85; }
    button.secondary {
      background: var(--card);
      color: var(--fg);
      margin-top: 12px;
    }
    .buttons { display: flex; flex-direction: column; align-items: center; }
    p.code {
      margin: 28px 0 0;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p class="description" id="description"></p>
    <div class="buttons">
      <button id="reload" onclick="location.reload();"></button>
      <button class="secondary" id="back" onclick="history.back();"></button>
    </div>
    <p class="code" id="code"></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      function set(id, value) {
        document.getElementById(id).textContent = value || "";
      }
      var title = params.get("title") || "This page couldn't be loaded";
      set("title", title);
      document.title = title;
      set("description", params.get("description"));

      var reload = document.getElementById("reload");
      reload.textContent = params.get("button") || "Try again";

      // Only offer "Go back" when there's somewhere to go back to.
      var back = document.getElementById("back");
      if (window.history.length > 1) {
        back.textContent = "Go back";
      } else {
        back.style.display = "none";
      }

      var code = params.get("errorCode");
      if (code) set("code", code);
    })();
  </script>
</body>
</html>
