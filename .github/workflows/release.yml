name: Release

on:
  push:
    branches: [codex/beta]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, e.g. 1.0.0; leave empty for a beta'
        required: false
        type: string

permissions:
  contents: read

# Serialize release builds; each run publishes an immutable, uniquely versioned APK.
concurrency:
  group: tangent-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      TANGENT_KEYSTORE_BASE64: ${{ secrets.TANGENT_KEYSTORE_BASE64 }}
      TANGENT_KEYSTORE_PASSWORD: ${{ secrets.TANGENT_KEYSTORE_PASSWORD }}
      TANGENT_KEY_ALIAS: ${{ secrets.TANGENT_KEY_ALIAS }}
      TANGENT_KEY_PASSWORD: ${{ secrets.TANGENT_KEY_PASSWORD }}
      TANGENT_REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate signing inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in TANGENT_KEYSTORE_BASE64 TANGENT_KEYSTORE_PASSWORD TANGENT_KEY_ALIAS TANGENT_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name. See docs/OBTAINIUM.md."
              exit 1
            fi
          done
          umask 077
          keyfile="$RUNNER_TEMP/tangent-upload.jks"
          printf '%s' "$TANGENT_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          echo "TANGENT_KEYSTORE_FILE=$keyfile" >> "$GITHUB_ENV"

      - name: Set release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          VERSION_CODE_BASE: ${{ vars.TANGENT_VERSION_CODE_BASE || '1000000' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_release_version.py
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; fi
          python3 scripts/release_version.py --run-number "$GITHUB_RUN_NUMBER" \
            --base "$VERSION_CODE_BASE" --version "$version" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          install_tools() {
            local version="$1" archive="$2" checksum="$3"
            curl --fail --location --retry 3 "https://dl.google.com/android/repository/$archive" -o "$RUNNER_TEMP/$archive"
            printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$archive" | sha1sum --check -
            unzip -q "$RUNNER_TEMP/$archive" -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/$version"
          }
          # Checksums from Google's HTTPS SDK metadata; retain verification on every install.
          install_tools 19.0 commandlinetools-linux-13114758_latest.zip 5fdcc763663eefb86a5b8879697aa6088b041e70
          install_tools 23.0 commandlinetools-linux-16111833_latest.zip e025545c62a8e64c7559119566a569fb1dec5f60
          set +o pipefail
          yes | "$sdk/cmdline-tools/19.0/bin/sdkmanager" --sdk_root="$sdk" --licenses
          status=${PIPESTATUS[1]}
          set -o pipefail
          test "$status" -eq 0
          "$sdk/cmdline-tools/23.0/bin/android" --sdk="$sdk" sdk install 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Build and test signed APK
        shell: bash
        env:
          TANGENT_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TANGENT_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          node extension/build.js tangent --check
          node extension/test-render.js
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process --max-workers=1 :app:test :app:assembleRelease \
            -x :app:syncReaderRules -x :app:buildReaderExtension

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
          expected=$(keytool -exportcert -keystore "$TANGENT_KEYSTORE_FILE" \
            -storepass:env TANGENT_KEYSTORE_PASSWORD -alias "$TANGENT_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt")
          test "$expected" = "$actual"

      - name: Prepare release assets
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/tangent-$VERSION_NAME-arm64-v8a.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS)
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Signed arm64 APK for Android 8.0 or newer.

          To receive updates with Obtainium, add this repository URL and enable prereleases for beta builds.
          Android updates require the same signing key as your existing install. Back up browser data before changing keys.
          NOTES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tangent-${{ steps.version.outputs.tag }}
          path: release-assets/
          compression-level: 0
          retention-days: 7

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tangent Browser $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; publish a new version instead of replacing an APK."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tangent-upload.jks"
