<!doctype html><html><head><meta charset="utf-8"><title>iframe</title>
<style>body{background:#fff;color:#111}</style></head><body>
<iframe id="f" srcdoc="<style>body{background:#f8f8f8;color:#222}</style><p id=p>inner</p>"></iframe>
<script>
/* Same-origin iframes are separate documents the document-wide walk never entered. */
window.__probe=function(){
  var d=document.getElementById('f').contentDocument;
  return [{name:'iframe-body',bg:getComputedStyle(d.body).backgroundColor}];
};
</script>
</body></html>
