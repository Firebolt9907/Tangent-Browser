<!DOCTYPE html>
<!--
  Branded error page for failed navigations, served by LuminaRequestInterceptor via
  ErrorPages.createUrlEncodedErrorPage (browser-errorpages). The component loads this file as
  resource://android/assets/error_page_js.html with the localized text passed as query params:
    title, description, button, errorCode  (plus advanced-cert params we intentionally ignore).
  LuminaRequestInterceptor appends extra detail of its own:
    host / failedUrl / errorName  (the failing site + technical error type), and, on Android 12+,
    accentLight / accentOnLight / accentDark / accentOnDark  (the device's Material You accent; the
    script picks per color scheme).

  Security: `host`, `failedUrl`, `errorName` and the title are inserted via textContent so a hostile
  failing URL can't inject markup. The component `description` is genuinely rich HTML (localized
  <p>/<ul><li> troubleshooting tips) and may interpolate the failing URL, so it is NOT trusted: it is
  rebuilt through a strict allow-list sanitizer (renderDescription) that keeps only a handful of
  text-formatting tags, copies NO attributes, and drops everything else to its text — so injected
  markup (script/style tags, img-onerror, href, and the like) can never execute.

  The Reload button re-requests the original URL — GeckoView keeps the failed URI as the current
  history entry, so location.reload() retries the real page, not this document.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1c1b1f;
      --muted: #5f5c66;
      --accent: #0060df;
      --accent-fg: #ffffff;
      --card: #f4f2f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b1f;
        --fg: #eae6ef;
        --muted: #a9a4b0;
        --accent: #7c9dff;
        --accent-fg: #08213f;
        --card: #26242b;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      /* Column (not row) centering: the app injects full-width viewport-spacer <div>s as the
         first/last child of <body>. In a flex ROW those become horizontal siblings and shove the
         card off the left edge; in a flex COLUMN they stack vertically and leave the card centered. */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 8px;
    }
    p.host {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--fg);
      margin: 0 0 18px;
      word-break: break-all;
      opacity: 0.85;
    }
    .description {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 28px;
      text-align: left;
      word-break: break-word;
    }
    /* Only left-align when the tips are an actual list; a lone sentence reads better centered. */
    .description.plain { text-align: center; }
    .description p { margin: 0 0 0.6em; }
    .description p:last-child { margin-bottom: 0; }
    .description ul, .description ol { margin: 0.4em 0 0; padding-left: 1.3em; }
    .description li { margin: 0.4em 0; }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 1rem;
      font-weight: 600;
      padding: 13px 28px;
      cursor: pointer;
      min-width: 180px;
    }
    button:active { opacity: 0.85; }
    button.secondary {
      background: var(--card);
      color: var(--fg);
      margin-top: 12px;
    }
    .buttons { display: flex; flex-direction: column; align-items: center; }
    details.tech {
      margin-top: 28px;
      width: 100%;
      text-align: left;
    }
    details.tech summary {
      cursor: pointer;
      list-style: none;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.85;
      padding: 6px;
    }
    details.tech summary::-webkit-details-marker { display: none; }
    details.tech .tech-body {
      margin-top: 10px;
      padding: 12px 14px;
      background: var(--card);
      border-radius: 12px;
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--muted);
      word-break: break-all;
    }
    details.tech .tech-body .row { display: flex; gap: 8px; }
    details.tech .tech-body .row .k { flex: 0 0 auto; font-weight: 600; opacity: 0.8; }
    details.tech .tech-body .row .v { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p class="host" id="host" hidden></p>
    <div class="description plain" id="description"></div>
    <div class="buttons">
      <button id="reload" onclick="location.reload();"></button>
      <button class="secondary" id="back" onclick="history.back();"></button>
    </div>
    <details class="tech" id="tech" hidden>
      <summary id="techSummary">Technical details</summary>
      <div class="tech-body" id="techBody"></div>
    </details>
  </main>
  <script>
    (function () {
      // Read the params from document.documentURI, NOT location.search: when GeckoView displays this
      // error page, window.location reflects the FAILED site (e.g. https://youtube.com/, no query),
      // while documentURI stays our resource://…error_page_js.html?title=… URL that carries them.
      // (browser-errorpages' own script does the same.) Fall back to location.search for direct opens.
      function queryString() {
        var uri = document.documentURI || "";
        var q = uri.indexOf("?");
        if (q >= 0) return uri.substring(q + 1);
        return (location.search || "").replace(/^\?/, "");
      }
      var params = new URLSearchParams(queryString());
      function set(id, value) {
        document.getElementById(id).textContent = value || "";
      }

      var title = params.get("title") || "This page couldn't be loaded";
      set("title", title);
      document.title = title;

      // Failing host (or full URL) shown prominently under the title. textContent — never trusted.
      var host = params.get("host") || params.get("failedUrl");
      if (host) {
        var hostEl = document.getElementById("host");
        hostEl.textContent = host;
        hostEl.hidden = false;
      }

      // Rich localized troubleshooting HTML from browser-errorpages, rebuilt through a strict
      // allow-list so it renders as real <p>/<ul><li> tips while staying injection-proof: only these
      // tags survive, no attributes are copied, and any other element collapses to its text.
      var ALLOWED = { P: 1, BR: 1, UL: 1, OL: 1, LI: 1, STRONG: 1, B: 1, EM: 1, I: 1, SPAN: 1 };
      function sanitize(node) {
        var frag = document.createDocumentFragment();
        node.childNodes.forEach(function (child) {
          if (child.nodeType === 3) {
            frag.appendChild(document.createTextNode(child.nodeValue));
          } else if (child.nodeType === 1) {
            if (ALLOWED[child.tagName]) {
              var el = document.createElement(child.tagName.toLowerCase());
              el.appendChild(sanitize(child));
              frag.appendChild(el);
            } else {
              frag.appendChild(sanitize(child));
            }
          }
        });
        return frag;
      }
      function renderDescription(html) {
        var out = document.getElementById("description");
        out.textContent = "";
        if (!html) return;
        // <template> content is inert: parsing here never runs scripts or loads resources.
        var tpl = document.createElement("template");
        tpl.innerHTML = html;
        out.appendChild(sanitize(tpl.content));
        // Left-align once there's a bullet list; keep a lone sentence centered.
        if (out.querySelector("li")) out.classList.remove("plain");
      }
      renderDescription(params.get("description"));

      // Follow the device's Material You accent (passed by LuminaRequestInterceptor on Android 12+).
      // Pick the light/dark variant from the system color scheme; if the params are absent the CSS
      // keeps its built-in blue fallback. Re-picks live if the system theme flips.
      if (window.matchMedia) {
        var scheme = window.matchMedia("(prefers-color-scheme: dark)");
        var applyAccent = function () {
          var dark = scheme.matches;
          var accent = params.get(dark ? "accentDark" : "accentLight");
          var accentFg = params.get(dark ? "accentOnDark" : "accentOnLight");
          var root = document.documentElement.style;
          if (accent) root.setProperty("--accent", accent);
          if (accentFg) root.setProperty("--accent-fg", accentFg);
        };
        applyAccent();
        if (scheme.addEventListener) scheme.addEventListener("change", applyAccent);
      }

      var reload = document.getElementById("reload");
      reload.textContent = params.get("button") || "Try again";

      // Only offer "Go back" when there's somewhere to go back to.
      var back = document.getElementById("back");
      if (window.history.length > 1) {
        back.textContent = "Go back";
      } else {
        back.style.display = "none";
      }

      // Collapsible technical details: the human error name and the component's error code, each
      // added via textContent. Shown only when we actually have something to report.
      function prettyError(name) {
        if (!name) return "";
        return name.replace(/^ERROR_/, "").replace(/_/g, " ").toLowerCase()
          .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      }
      function techRow(label, value) {
        var row = document.createElement("div");
        row.className = "row";
        var k = document.createElement("span");
        k.className = "k";
        k.textContent = label;
        var v = document.createElement("span");
        v.className = "v";
        v.textContent = value;
        row.appendChild(k);
        row.appendChild(v);
        return row;
      }
      var techBody = document.getElementById("techBody");
      var errorName = prettyError(params.get("errorName"));
      var code = params.get("errorCode");
      if (errorName) techBody.appendChild(techRow("Reason", errorName));
      if (code) techBody.appendChild(techRow("Code", code));
      if (params.get("failedUrl")) techBody.appendChild(techRow("URL", params.get("failedUrl")));
      if (techBody.childNodes.length) document.getElementById("tech").hidden = false;
    })();
  </script>
</body>
</html>
