<!doctype html><html><head><meta charset="utf-8"><title>bgimage</title>
<style>body{background:#fff;color:#111}
#hero{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="%23ffffff"/></svg>');
      width:400px;height:300px;color:#111}
#icon{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect width="16" height="16" fill="%23ffffff"/></svg>');
      width:16px;height:16px}</style>
</head><body>
<div id="hero">hero text over a light photo</div>
<div id="icon"></div>
<script>
/* A section whose background is a light image stays glaring, and any text over it goes invisible.
   The small icon must NOT be scrimmed (sprites/icons are below the size floor). */
window.__probe=function(){
  return [
    {name:'hero',bgImage:getComputedStyle(document.getElementById('hero')).backgroundImage},
    {name:'icon',bgImage:getComputedStyle(document.getElementById('icon')).backgroundImage},
  ];
};
</script>
</body></html>
