<!doctype html><html><head><meta charset="utf-8"><title>pseudo</title>
<style>body{background:#fff;color:#111}
#bar{background:#eee;color:#222;position:relative;padding:20px}
#bar::before{content:"";display:block;background:#fdfdfd;height:20px}</style>
</head><body>
<div id="bar">bar</div>
<script>
/* A pseudo-element can't take an inline style, so it survived the whole recolor as a light strip. */
window.__probe=function(){
  var b=document.getElementById('bar');
  return [{name:'bar::before',bg:getComputedStyle(b,'::before').backgroundColor}];
};
</script>
</body></html>
