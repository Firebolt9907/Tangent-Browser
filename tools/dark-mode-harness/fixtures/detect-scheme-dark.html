<!doctype html>
<!-- Ships its dark theme by declaring color-scheme and letting the UA paint the canvas — nothing
     declares an opaque background at all. "No background" does NOT mean white here. -->
<html><head><meta charset="utf-8"><title>scheme dark</title>
<style>:root{color-scheme:dark}</style></head>
<body><h1>Hello</h1><p>Canvas painted by the UA.</p></body></html>
