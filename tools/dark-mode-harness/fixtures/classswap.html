<!doctype html><html><head><meta charset="utf-8"><title>classswap</title>
<style>body{background:#fff;color:#111}
/* Starts with NO background of its own (transparent → the walk writes nothing and latches it
   done), then a class swap 400ms later gives it a light one. Elements were never re-read after
   their first visit and attribute mutations were not observed, so this stayed light forever.
   The panel must start transparent for this to discriminate: an element that starts DARK gets its
   dark color pinned inline with !important on the first pass, which masks the later class by
   accident and would make this fixture pass against the old code for the wrong reason. */
#panel{color:#222;padding:20px}
#panel.light{background:#fbfbfb;color:#222}</style>
</head><body>
<div id="panel">panel</div>
<script>
setTimeout(function(){document.getElementById('panel').className='light';window.__swapped=1;},400);
window.__probe=function(){
  var p=document.getElementById('panel');
  return [{name:'panel',bg:getComputedStyle(p).backgroundColor}];
};
</script>
</body></html>
