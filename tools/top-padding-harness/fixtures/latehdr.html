<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  body{margin:0;font-family:sans-serif}
  .tall{height:2500px;padding-top:120px}
  .bar{display:flex;align-items:center;gap:12px;padding:0 12px;box-sizing:border-box}
  .logo{width:28px;height:28px;background:#e00;border-radius:6px}
</style></head><body>
<!--
  LATENCY fixture for latencyTest.js. The page sits idle long enough for the injected script's
  adaptive cooldown to relax (500ms -> 2000ms once the chosen header set has been stable for 3
  passes). Then `window.__mountRoute()` simulates an SPA route change: a pushState plus a freshly
  mounted fixed header with real content in the status-bar band. The probe measures how long the
  header stays under the status bar before the script insets it.
-->
<div class="tall" id="content"><h1>Idle page</h1><p>No header yet.</p></div>
<script>
window.__mountRoute = function () {
  history.pushState({}, '', location.pathname + '?route=2');
  const h = document.createElement('header');
  h.className = 'bar';
  h.id = 'lateHeader';
  h.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc;z-index:9';
  h.innerHTML = '<div class="logo"></div><span>Route 2 header</span><button>Menu</button>';
  document.body.appendChild(h);
};
/* A no-pushState variant: some SPAs swap the view without touching history at all. */
window.__mountRouteNoNav = function () {
  const h = document.createElement('header');
  h.className = 'bar';
  h.id = 'lateHeader';
  h.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc;z-index:9';
  h.innerHTML = '<div class="logo"></div><span>Silent route header</span><button>Menu</button>';
  document.body.appendChild(h);
};
/* Same late mount, but the page is a scroll-LOCKED viewport app shell — the inset there is applied
   by padding the shell, not by the in-flow spacer, so the cooldown bypass has to work on that path
   too. Selected with ?case=shell. */
if (new URLSearchParams(location.search).get('case') === 'shell') {
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  document.getElementById('content').remove();
  const s = document.createElement('div');
  s.id = 'appshell';
  s.style.cssText = 'height:100vh;display:flex;flex-direction:column';
  s.innerHTML = '<div style="flex:1;overflow:auto;padding:12px">app content</div>';
  document.body.appendChild(s);
}
/* A late STICKY header (sticky headers take applySticky, not applyFixed). ?case=sticky */
window.__mountSticky = function () {
  const h = document.createElement('header');
  h.className = 'bar';
  h.id = 'lateHeader';
  h.style.cssText = 'position:sticky;top:0;height:56px;background:#fff;border-bottom:1px solid #ccc';
  h.innerHTML = '<div class="logo"></div><span>Late sticky header</span>';
  document.body.insertBefore(h, document.body.firstChild);
};
</script>
</body></html>
