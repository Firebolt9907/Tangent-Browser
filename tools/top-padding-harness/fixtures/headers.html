<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  body{margin:0;font-family:sans-serif}
  .tall{height:2500px;padding-top:120px}
  .bar{display:flex;align-items:center;gap:12px;padding:0 12px;box-sizing:border-box}
  .logo{width:28px;height:28px;background:#e00;border-radius:6px}
  .txt{font-weight:600}
</style></head><body>
<!-- Each fixture is toggled by ?case=NAME so we can test one header pattern at a time on a clean body. -->
<div class="tall" id="content">
  <h1>Fixture body</h1>
  <p>Scroll region. The header for the selected case is injected by script below.</p>
</div>
<script>
const cases = {
  // 1. Stacked promo bar + nav (both fixed, promo above nav).
  stacked(){
    const promo=document.createElement('div');promo.className='bar';promo.style.cssText='position:fixed;top:0;left:0;width:100%;height:40px;background:#2b6;color:#fff;z-index:20';
    promo.innerHTML='<span class="txt">PROMO: free shipping</span>';
    const nav=document.createElement('header');nav.className='bar';nav.style.cssText='position:fixed;top:40px;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc;z-index:19';
    nav.innerHTML='<div class="logo"></div><span class="txt">BrandNav</span><button>Menu</button>';
    document.body.append(promo,nav);
  },
  // 2. Fixed header inside an ancestor with transform (changes the fixed containing block!).
  transformed(){
    const wrap=document.createElement('div');wrap.style.cssText='transform:translateZ(0);position:relative';
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:fixed;top:0;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">Transformed header</span>';
    wrap.appendChild(h);document.body.appendChild(wrap);
  },
  // 3. RTL fixed header (logo on the right).
  rtl(){
    document.documentElement.setAttribute('dir','rtl');
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:fixed;top:0;right:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">رأس الصفحة</span>';
    document.body.appendChild(h);
  },
  // 4. Fixed header with an existing translateY transform (bandShift/applyFixed must compose).
  pretransformed(){
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:fixed;top:0;left:0;width:100%;height:56px;background:#fff;transform:translateY(0)';
    h.innerHTML='<div class="logo"></div><span class="txt">Pre-transformed</span>';
    document.body.appendChild(h);
  },
  // 5. Sticky header whose content is absolutely positioned (apple-style, but sticky).
  stickyAbs(){
    const h=document.createElement('header');h.style.cssText='position:sticky;top:0;height:56px;background:#fff;border-bottom:1px solid #ccc';
    const inner=document.createElement('div');inner.className='bar';inner.style.cssText='position:absolute;top:0;left:0;width:100%;height:56px';
    inner.innerHTML='<div class="logo"></div><span class="txt">Sticky+absolute inner</span>';
    h.appendChild(inner);document.body.insertBefore(h,document.body.firstChild);
  },
  // 6. Fixed header with a negative top (common trick to hide the top border/shadow).
  negativeTop(){
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:fixed;top:-1px;left:0;width:100%;height:57px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">Negative-top header</span>';
    document.body.appendChild(h);
  },
  // 7. Fixed header with will-change:transform (like transform, changes the containing block).
  willChange(){
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:fixed;top:0;left:0;width:100%;height:56px;background:#fff;will-change:transform';
    h.innerHTML='<div class="logo"></div><span class="txt">will-change header</span>';
    document.body.appendChild(h);
  },
  // 9. Anchor-jump target: verifies scroll-padding-top lands #hash navigation BELOW the inset.
  anchor(){
    const nav=document.createElement('div');nav.innerHTML='<a id="jump" href="#target">jump</a>';
    const spacer=document.createElement('div');spacer.style.height='1500px';
    const tgt=document.createElement('h2');tgt.id='target';tgt.textContent='ANCHOR TARGET';
    const after=document.createElement('div');after.style.height='1500px';
    document.getElementById('content').append(nav,spacer,tgt,after);
  },
  // 10. Header inside an OPEN shadow root (collect() must descend into shadow DOM).
  shadowHeader(){
    const host=document.createElement('div');document.body.insertBefore(host,document.body.firstChild);
    const sr=host.attachShadow({mode:'open'});
    const h=document.createElement('header');h.style.cssText='position:fixed;top:0;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:12px;padding:0 12px;box-sizing:border-box';
    h.innerHTML='<div style="width:28px;height:28px;background:#e00;border-radius:6px"></div><span style="font-weight:600">Shadow header</span>';
    sr.appendChild(h);
  },
  // 12. Header that starts display:none and is revealed after a tick (observer must re-inset).
  revealedHeader(){
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:fixed;top:0;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc;display:none';
    h.innerHTML='<div class="logo"></div><span class="txt">Revealed header</span>';
    document.body.appendChild(h);
    setTimeout(()=>{h.style.display='flex';},1500);
  },
  // 13. Stacked sticky sub-nav: a main sticky bar + a second sticky bar directly under it.
  stickySubnav(){
    const main=document.createElement('header');main.className='bar';main.style.cssText='position:sticky;top:0;height:48px;background:#fff;border-bottom:1px solid #ccc';
    main.innerHTML='<div class="logo"></div><span class="txt">Main</span>';
    const sub=document.createElement('nav');sub.className='bar';sub.style.cssText='position:sticky;top:0;height:40px;background:#f3f3f3;border-bottom:1px solid #ddd';
    sub.innerHTML='<span class="txt">Sub-nav A</span><span class="txt">B</span><span class="txt">C</span>';
    document.body.insertBefore(sub,document.body.firstChild);document.body.insertBefore(main,document.body.firstChild);
  },
  // 8. Sticky header INSIDE a nested overflow-scroll container (not body scroll) — Spotify-like.
  nestedScrollSticky(){
    document.getElementById('content').style.display='none';
    const sc=document.createElement('div');sc.style.cssText='position:absolute;inset:0;overflow-y:auto';
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:sticky;top:0;height:56px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">Nested-scroll sticky</span>';
    const body=document.createElement('div');body.className='tall';body.textContent='inner scroll content';
    sc.append(h,body);document.body.appendChild(sc);
  },
  // 14. position:sticky header inside a transformed ancestor. transform makes the ancestor the
  //     containing block, so sticky sticks to the ANCESTOR box, not the viewport — a classic
  //     real-world break where a "sticky" bar ends up pinned in the band.
  stickyInTransformed(){
    const wrap=document.createElement('div');wrap.style.cssText='transform:translateZ(0)';
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:sticky;top:0;height:56px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">Sticky-in-transformed</span>';
    const filler=document.createElement('div');filler.className='tall';filler.textContent='content';
    wrap.append(h,filler);document.body.insertBefore(wrap,document.body.firstChild);
  },
  // 15. Header rendered as a top-layer <dialog open> pinned at top:0. Top-layer elements are
  //     painted outside normal flow parenting; collect() must still find/inset it.
  dialogTopBar(){
    const d=document.createElement('dialog');d.setAttribute('open','');
    d.className='bar';d.style.cssText='position:fixed;top:0;left:0;right:0;margin:0;width:100%;height:52px;background:#fff;border:0;border-bottom:1px solid #ccc;padding:0 12px;z-index:99';
    d.innerHTML='<div class="logo"></div><span class="txt">Dialog top bar</span><button>X</button>';
    document.body.appendChild(d);
  },
  // 16. Sticky header inside an ancestor using the INDIVIDUAL `translate` property (not the
  //     `transform` shorthand). translate/scale/rotate also reparent the containing block and
  //     stickiness, but surface as separate computed props — a break if detection only reads
  //     getComputedStyle().transform.
  stickyInTranslate(){
    const wrap=document.createElement('div');wrap.style.cssText='translate:0px 0px';
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:sticky;top:0;height:56px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">Sticky-in-translate</span>';
    const filler=document.createElement('div');filler.className='tall';filler.textContent='content';
    wrap.append(h,filler);document.body.insertBefore(wrap,document.body.firstChild);
  },
  // 17. Header shown via the Popover API ([popover] + showPopover()) pinned at top:0 — top layer,
  //     like <dialog> but a different mechanism. collect() must find + inset it.
  popoverHeader(){
    const p=document.createElement('header');p.setAttribute('popover','manual');
    p.className='bar';p.style.cssText='position:fixed;top:0;left:0;right:0;margin:0;width:100%;height:52px;background:#fff;border:0;border-bottom:1px solid #ccc;padding:0 12px;z-index:99';
    p.innerHTML='<div class="logo"></div><span class="txt">Popover header</span><button>Go</button>';
    document.body.appendChild(p);
    try{p.showPopover();}catch(e){}
  },
  // 19. Site defines its OWN scroll-padding-top:0 !important on :root (specificity 0,1,0, higher
  //     than our html,body 0,0,1). If our injected rule loses the cascade, in-page #anchor jumps
  //     land UNDER the status bar. Sets up the conflicting rule + an anchor target; drive with
  //     anchorTest.js (targetSelector '#target', no clickSelector).
  siteScrollPad(){
    const st=document.createElement('style');st.textContent=':root{scroll-padding-top:0px!important}';
    document.head.appendChild(st);
    const nav=document.createElement('div');nav.innerHTML='<a id="jump" href="#target">jump</a>';
    const spacer=document.createElement('div');spacer.style.height='1500px';
    const tgt=document.createElement('h2');tgt.id='target';tgt.textContent='ANCHOR TARGET';
    const after=document.createElement('div');after.style.height='1500px';
    document.getElementById('content').append(nav,spacer,tgt,after);
  },
  // 20. Site forces the header's padding-top to 0 via a high-specificity stylesheet !important
  //      rule (#sh, 1,0,0). applyFixed sets padding-top INLINE !important — author inline
  //      important must beat author stylesheet important regardless of specificity.
  siteHeaderPadImportant(){
    const st=document.createElement('style');st.textContent='#sh{padding-top:0!important;top:0!important}';
    document.head.appendChild(st);
    const h=document.createElement('header');h.id='sh';h.className='bar';h.style.cssText='position:fixed;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">Site-padding-reset header</span>';
    document.body.appendChild(h);
  },
  // 21. Fixed header whose site styles live in a CSS @layer. For IMPORTANT declarations the layer
  //      order is REVERSED, so our UNLAYERED inline !important must still win over a layered
  //      !important site rule — verify a layered padding/top reset can't pull content into the band.
  layeredHeader(){
    const st=document.createElement('style');st.textContent='@layer site{#lh{padding-top:0!important;top:0!important}}';
    document.head.appendChild(st);
    const h=document.createElement('header');h.id='lh';h.className='bar';h.style.cssText='position:fixed;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">Layered header</span>';
    document.body.appendChild(h);
  },
  // 22. SPA whose REAL scroll container is a custom overflow:auto div, not html/body (body scroll
  //      disabled). scroll-padding-top on html/body is irrelevant here — the anchor jump scrolls
  //      the inner container, so its content lands UNDER the bar unless we pad the container too.
  //      Drive with anchorTest.js (targetSelector '#target', no clickSelector).
  customScrollContainer(){
    document.documentElement.style.cssText='height:100%;overflow:hidden';
    document.body.style.cssText='height:100%;overflow:hidden;margin:0';
    document.getElementById('content').style.display='none';
    const sc=document.createElement('div');sc.id='scroller';sc.style.cssText='height:100vh;overflow-y:auto';
    const nav=document.createElement('div');nav.innerHTML='<a id="jump" href="#target">jump</a>';
    const spacer=document.createElement('div');spacer.style.height='1500px';
    const tgt=document.createElement('h2');tgt.id='target';tgt.textContent='ANCHOR TARGET';
    const after=document.createElement('div');after.style.height='1500px';
    sc.append(nav,spacer,tgt,after);document.body.appendChild(sc);
  },
  // 23. Site has its OWN sticky header (64px) AND sets :root{scroll-padding-top:64px} to clear it
  //      (a common pattern; no scroll-margin on targets). We inset that header down by topPx (so it
  //      occupies topPx..topPx+64) — so the CORRECT anchor padding is topPx+64, not topPx. Tests
  //      whether iter-22's "force scroll-padding-top to topPx" regresses this: target must land
  //      BELOW the inset header (top >= topPx+64-ish), not merely >= topPx. Drive with anchorTest
  //      using targetSelector '#target'; a landing at ~48 means the header overlaps the target.
  siteHeaderScrollPad(){
    const st=document.createElement('style');st.textContent='html{scroll-padding-top:64px}';
    document.head.appendChild(st);
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:sticky;top:0;height:64px;background:#fff;border-bottom:1px solid #ccc;z-index:10';
    h.innerHTML='<div class="logo"></div><span class="txt">Site sticky header</span>';
    const nav=document.createElement('div');nav.innerHTML='<a id="jump" href="#target">jump</a>';
    const spacer=document.createElement('div');spacer.style.height='1500px';
    const tgt=document.createElement('h2');tgt.id='target';tgt.style.cssText='background:#ffd';tgt.textContent='ANCHOR TARGET';
    const after=document.createElement('div');after.style.height='1500px';
    document.getElementById('content').replaceChildren(nav,spacer,tgt,after);
    document.body.insertBefore(h,document.body.firstChild);
  },
  // 24. Fixed nav (64px) with NO declared scroll-padding-top and NO scroll-margin on targets — the
  //      site relies on neither, so after we inset the nav (occupying [0, topPx+64]) a plain
  //      scroll-padding-top of topPx leaves the anchor target hidden behind it. scroll-padding-top
  //      must rise to the inset nav's bottom (~topPx+64). Repro of kubernetes.io/docs. Drive with
  //      anchorTest '#target'.
  fixedNavNoScrollPad(){
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:fixed;top:0;left:0;width:100%;height:64px;background:#fff;border-bottom:1px solid #ccc;z-index:10';
    h.innerHTML='<div class="logo"></div><span class="txt">Fixed nav, no scroll-pad</span>';
    const nav=document.createElement('div');nav.innerHTML='<a id="jump" href="#target">jump</a>';
    const spacer=document.createElement('div');spacer.style.height='1500px';
    const tgt=document.createElement('h2');tgt.id='target';tgt.style.cssText='background:#ffd';tgt.textContent='ANCHOR TARGET';
    const after=document.createElement('div');after.style.height='1500px';
    document.getElementById('content').replaceChildren(nav,spacer,tgt,after);
    document.body.insertBefore(h,document.body.firstChild);
  },
  // 25. Body is display:grid with grid-template-areas placing a STATIC header in row 1. An in-flow
  //      spacer div (grid-column/order) can't push an area-placed grid item, so the header stays in
  //      the band — the fix pads the grid container instead. Repro of learn.microsoft.com.
  gridBodyHeader(){
    document.getElementById('content').remove();
    document.body.style.cssText='margin:0;display:grid;grid-template-rows:54px 1fr;grid-template-areas:"header" "main"';
    const h=document.createElement('header');h.className='bar';h.style.cssText='grid-area:header;height:54px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">Grid-area header</span>';
    const main=document.createElement('main');main.style.cssText='grid-area:main';main.className='tall';main.textContent='grid main content';
    document.body.append(h,main);
  },
  // 18. Fixed header inside a `container-type:inline-size` ancestor. Query containers establish a
  //     containing block for fixed descendants (distinct trigger from transform/filter) — the bar
  //     is positioned relative to the container box, not the viewport. bandShift's translateY must
  //     still lift it out of the band. Container has real height so the header is visible.
  fixedInContainer(){
    const wrap=document.createElement('div');wrap.style.cssText='container-type:inline-size;position:relative;min-height:2500px';
    const h=document.createElement('header');h.className='bar';h.style.cssText='position:fixed;top:0;left:0;width:100%;height:56px;background:#fff;border-bottom:1px solid #ccc';
    h.innerHTML='<div class="logo"></div><span class="txt">container-query header</span>';
    wrap.appendChild(h);document.body.insertBefore(wrap,document.body.firstChild);
  },
};
const c = new URLSearchParams(location.search).get('case');
if (cases[c]) cases[c]();
</script>
</body></html>
