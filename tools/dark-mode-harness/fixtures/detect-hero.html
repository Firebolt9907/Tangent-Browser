<!doctype html>
<!-- The false-positive guard, and the reason the viewport probe reports the LIGHTEST surface rather
     than the average: a genuinely LIGHT page whose dark hero fills most of the first screen. This
     must still be inverted, or a light site stays light with dark mode on. -->
<html><head><meta charset="utf-8"><title>light with dark hero</title>
<style>
  html,body{margin:0;background:#fff;color:#111}
  #hero{height:80vh;background:#111;color:#fff}
  #rest{padding:40px;background:#fff;color:#111}
</style></head>
<body>
  <div id="hero"><h1>Big dark hero</h1></div>
  <div id="rest"><p>Ordinary light article body below the fold.</p></div>
</body></html>
