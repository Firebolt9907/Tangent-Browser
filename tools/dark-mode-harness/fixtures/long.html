<!doctype html><html><head><meta charset="utf-8"><title>long</title>
<style>body{background:#fff;color:#111;margin:0}.row{background:#f4f4f4;color:#222;padding:1px}</style>
</head><body>
<script>
/* 12000 rows: the old fixed 8000-element cap restarted at index 0 on every pass, so rows past
   8000 were never darkened no matter how many passes ran. */
var f=document.createDocumentFragment();
for(var i=0;i<12000;i++){var d=document.createElement('div');d.className='row';d.id='row'+i;d.textContent='row '+i;f.appendChild(d);}
document.body.appendChild(f);
window.__probe=function(){
  return [10,4000,7999,8000,9000,11999].map(function(n){
    var el=document.getElementById('row'+n);
    return {name:'row'+n,bg:getComputedStyle(el).backgroundColor};
  });
};
</script>
</body></html>
